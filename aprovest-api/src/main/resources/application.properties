spring.application.name=aprovest
server.port=8080

# =====================================================================
# SQL Server  (mesmo padrão do projeto modelo do professor)
# Altere usuário/senha conforme a instalação local do SQL Server.
# Os valores podem ser sobrescritos por variáveis de ambiente:
#   APROVEST_DB_URL, APROVEST_DB_USER, APROVEST_DB_PASSWORD
# =====================================================================
spring.datasource.url=${APROVEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=aprovestdb;integratedSecurity=false;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${APROVEST_DB_USER:sa}
spring.datasource.password=${APROVEST_DB_PASSWORD:}
# Valores locais (senha do banco etc.) ficam em application-local.properties, fora do Git.
# Copie application-local.properties.example para application-local.properties e ajuste.
spring.config.import=optional:classpath:application-local.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA - as tabelas são criadas pelos scripts da pasta /database (ddl-auto=none)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Mantém os nomes das tabelas como no script (PascalCase) e converte os atributos para snake_case
spring.jpa.hibernate.naming.physical-strategy=com.itb.inf2cm.aprovest.config.NomeTabelaNamingStrategy

# =====================================================================
# JWT (JSON Web Token)
# =====================================================================
application.security.jwt.secret-key=${APROVEST_JWT_SECRET:7c4f1e9a2b6d8053a1e47f9c3d2b5e8a0f6c9d1e4b7a2f5c8e3d6b9a1c4f7e20}
# 1 dia (milissegundos)
application.security.jwt.expiration=86400000
# 7 dias (milissegundos)
application.security.jwt.refresh-token.expiration=604800000

# CORS - endereços do front-end Vite
app.cors.origens=http://localhost:5173,http://localhost:5174,http://localhost:4173

# =====================================================================
# Inteligência artificial (correção de redação)
# Coloque sua chave da Anthropic na variável de ambiente ANTHROPIC_API_KEY
# (ou no arquivo .env do back-end). Sem chave, o sistema usa o corretor offline.
# =====================================================================
app.ia.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ia.modelo=claude-opus-5-5

# Login com Google (opcional). Crie um "OAuth Client ID" (tipo Web) no Google Cloud Console.
app.google.client-id=${APROVEST_GOOGLE_CLIENT_ID:}

# Recuperação de senha: sem servidor de e-mail, o link é exibido em modo demonstração
app.modo-demonstracao=true
app.front-url=http://localhost:5173

# =====================================================================
# Regras de negócio (RN02 / RF10 / RF11 / RF05)
# =====================================================================
app.plano.free.questoes-dia=20
app.plano.free.correcoes-ia-mes=1
app.plano.pro.questoes-dia=200
app.plano.pro.correcoes-ia-mes=30
app.preco.pro-mensal=29.90
app.preco.credito-unitario=9.90
app.preco.pacote-5-creditos=39.90
app.corretor.percentual-repasse=0.70

# Contas criadas automaticamente na primeira execução (ambiente local de desenvolvimento)
app.seed.admin-email=admin@aprovest.com.br
app.seed.corretor-email=corretor@aprovest.com.br
app.seed.aluno-email=aluno@aprovest.com.br
app.seed.senha-padrao=${APROVEST_SEED_PASSWORD:Aprovest@123}
# Cria alunos de demonstração com histórico, para que percentil e ranking tenham comparação
app.seed.alunos-demonstracao=true

spring.jackson.time-zone=America/Sao_Paulo
spring.servlet.multipart.max-file-size=5MB
